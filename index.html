<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный Архив</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00fff2;
        }

        /* Кнопка вызова GUI */
        .action-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #101026;
            background: #00fff2;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 242, 0.4);
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00fff2;
            background: #fff;
        }

        /* Окно ввода пароля (GUI) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .gui-box {
            background: #16162a;
            border: 2px solid #ff007f;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
        }

        .password-input {
            width: 100%;
            padding: 12px;
            background: #0f0f1b;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        .password-input:focus { border-color: #ff007f; }

        .gui-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn { background: #ff007f; color: #fff; margin-right: 10px; }
        .close-btn { background: #333; color: #aaa; }

        /* СЕКРЕТНАЯ ПАНЕЛЬ С ФАЙЛАМИ (Изначально скрыта) */
        .secret-panel {
            display: none;
            width: 100%;
            max-width: 900px;
            background: rgba(22, 22, 42, 0.6);
            border: 2px solid #00fff2;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 242, 0.15);
            animation: slideUp 0.5s ease-out forwards;
        }

        .secret-panel h2 {
            margin-bottom: 25px;
            color: #00fff2;
            text-shadow: 0 0 10px rgba(0, 255, 242, 0.5);
        }

        /* Сетка для файлов как на вашем рисунке */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Карточка файла */
        .file-card {
            background: #111122;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .file-card:hover {
            border-color: #00fff2;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 242, 0.2);
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div class="container" id="mainWelcome">
        <h1>Secret Portal</h1>
        <button class="action-btn" onclick="toggleModal(true)">Войти по паролю</button>
    </div>

    <!-- GUI ввода пароля -->
    <div class="modal-overlay" id="passwordModal">
        <div class="gui-box">
            <h3 style="margin-bottom:15px;">Введите Ключ</h3>
            <input type="password" id="passInput" class="password-input" placeholder="••••••••">
            <div>
                <button class="gui-btn submit-btn" onclick="checkPassword()">Проверить</button>
                <button class="gui-btn close-btn" onclick="toggleModal(false)">Отмена</button>
            </div>
        </div>
    </div>

    <!-- СЕКРЕТНАЯ ПАНЕЛЬ С ФАЙЛАМИ (Появится после ввода пароля) -->
    <div class="secret-panel" id="secretPanel">
        <h2>Доступ разрешен. Ваши файлы:</h2>
        
        <div class="files-grid">
            
            <!-- ФАЙЛ 1 -->
            <a href="files/document.pdf" class="file-card" download>
                <div class="file-icon">📄</div>
                <div class="file-name">Инструкция.pdf</div>
            </a>

            <!-- ФАЙЛ 2 -->
            <a href="files/photo.png" class="file-card" download>
                <div class="file-icon">🖼️</div>
                <div class="file-name">Картинка.png</div>
            </a>

            <!-- ФАЙЛ 3 -->
            <a href="files/archive.zip" class="file-card" download>
                <div class="file-icon">📦</div>
                <div class="file-name">Архив.zip</div>
            </a>

        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "09041488";
        const modal = document.getElementById('passwordModal');
        const input = document.getElementById('passInput');

        function toggleModal(show) {
            if (show) { modal.classList.add('active'); input.focus(); } 
            else { modal.classList.remove('active'); input.value = ''; }
        }

        function checkPassword() {
            if (input.value === CORRECT_PASSWORD) {
                toggleModal(false);
                document.getElementById('mainWelcome').style.display = 'none'; // Скрываем вход
                document.getElementById('secretPanel').style.display = 'block'; // Показываем файлы
            } else {
                alert("Неверный пароль!");
                input.value = '';
                input.focus();
            }
        }

        input.addEventListener("keypress", function(e) { if (e.key === "Enter") checkPassword(); });
    </script>
</body>
</html>
